services:
  postgres:
    image: postgres:15
    container_name: upi_postgres
    environment:
      POSTGRES_DB: upi_disputes
      POSTGRES_USER: upi_user
      POSTGRES_PASSWORD: upi_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 256m

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: upi_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx64m -Xms32m"
    mem_limit: 128m

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: upi_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_CLEANER_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx192m -Xms96m"
    mem_limit: 320m

  redis:
    image: redis:7-alpine
    container_name: upi_redis
    ports:
      - "6379:6379"
    mem_limit: 64m

volumes:
  postgres_data: