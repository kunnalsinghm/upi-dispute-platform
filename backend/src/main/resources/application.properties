spring.application.name=dispute-service
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5433/upi_disputes
spring.datasource.username=upi_user
spring.datasource.password=upi_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=dispute-group
spring.kafka.consumer.auto-offset-reset=earliest
management.endpoints.web.exposure.include=health,info

spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC